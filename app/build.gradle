plugins {
    id 'com.android.application'
}

android {
    namespace 'com.javierrb35.flashlight'
    compileSdk 34

    defaultConfig {
        applicationId 'com.javierrb35.flashlight'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Release signing never embeds secrets in the repository.
    signingConfigs {
        release {
            storeFile file(System.getenv('FLASHLIGHT_KEYSTORE_FILE') ?: '../.signing/flashlight-release.jks')
            storePassword System.getenv('FLASHLIGHT_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('FLASHLIGHT_KEY_ALIAS') ?: 'flashlight'
            keyPassword System.getenv('FLASHLIGHT_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('FLASHLIGHT_SIGN_RELEASE') == 'true')
                signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
